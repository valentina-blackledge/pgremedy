[project]
name = "pgremedy"
version = "0.1.0"
description = "PostgreSQL CVE detection, remediation, and monitoring"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "psycopg[binary]>=3.1",
    "packaging>=23.0",
    "rich>=13.0",
]

[project.scripts]
pgremedy = "pgremedy.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgremedy"]
